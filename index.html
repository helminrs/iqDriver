<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iqDriver - Dashboard iqBike</title>

    <!-- PWA & Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8cc63f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iqDriver">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --primary-green: #8cc63f;
            --primary-green-hover: #7ab332;
            --text-light: #ffffff;
            --text-dark: #222222;
            --bg-body: #1e1e1e;
            --border-color: #333333;
            --accent-red: #eb5757;
            --accent-blue: #0288d1;
            --whatsapp-green: #25D366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #181818;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: white;
            text-align: center;
        }

        .login-card {
            background: #222;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .header {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            flex-shrink: 0;
            border-bottom: 1px solid #333;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-header-install {
            background: #222;
            color: var(--primary-green);
            border: 1px solid #444;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .content-area {
            display: flex;
            flex-direction: column;
            flex: 1;
            position: relative;
            overflow-y: auto;
            padding: 10px;
            gap: 10px;
        }

        .driver-panel {
            background: #222;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 11px;
            background-color: var(--primary-green);
            color: #111;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 250px;
            background-color: #222;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #333;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .btn-my-location {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 42px;
            height: 42px;
            background-color: #ffffff;
            color: var(--accent-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            z-index: 1001;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- MODAL CUSTOM ALERT -->
    <div id="customAlertModal" class="modal-overlay" style="display: none;">
        <div class="login-card" style="background:#222; color:#fff; text-align:center; border:2px solid var(--primary-green);">
            <i class="fa-solid fa-circle-check" style="font-size:42px; color:var(--primary-green);"></i>
            <h3 id="customAlertTitle" style="margin-top:6px; font-size:16px;">Informasi</h3>
            <p id="customAlertMessage" style="font-size:12px; color:#ccc; line-height:1.4;">-</p>
            <button onclick="closeCustomAlertModal()" class="btn-submit" style="margin-top:4px;">
                <i class="fa-solid fa-check"></i> Oke
            </button>
        </div>
    </div>

    <!-- MODAL POPUP ORDERAN MASUK -->
    <div id="driverIncomingOrderModal" class="modal-overlay" style="display: none;">
        <div class="login-card" style="background:#222; color:#fff; border:2px solid var(--primary-green); text-align:left;">
            <div style="text-align:center;">
                <i class="fa-solid fa-bolt" style="font-size:38px; color:var(--primary-green);"></i>
                <h3 style="font-size:16px; margin-top:4px;">Orderan Terdekat Masuk!</h3>
                <p style="font-size:11px; color:#aaa;">Ada penumpang memesan layanan di sekitar lokasi Anda</p>
            </div>
            <div style="background:#2a2a2a; padding:10px; border-radius:8px; font-size:12px; display:flex; flex-direction:column; gap:4px;">
                <div><strong>👤 Penumpang:</strong> <span id="popupPassengerName">-</span></div>
                <div><strong>📍 Jemput:</strong> <span id="popupPickupText">-</span></div>
                <div><strong>🏁 Tujuan:</strong> <span id="popupDropoffText">-</span></div>
                <div style="color:var(--primary-green); font-weight:bold;"><strong>📍 Jarak Jemput:</strong> <span id="popupDriverDistance">-</span></div>
                <div style="color:var(--whatsapp-green); font-weight:bold;"><strong>💰 Estimasi Ongkos:</strong> <span id="popupFareText">-</span></div>
            </div>
            <button onclick="driverAcceptOrder()" class="btn-submit" style="background:var(--primary-green); color:#111; font-weight:bold;">
                <i class="fa-solid fa-motorcycle"></i> Terima / Ajukan Diri Sekarang
            </button>
            <button onclick="closeDriverIncomingModal()" style="background:none; border:none; color:#eb5757; font-size:11px; cursor:pointer; text-align:center;">Abaikan / Tutup</button>
        </div>
    </div>

    <header class="header">
        <div class="brand-title">
            <i class="fa-solid fa-motorcycle" style="color: var(--primary-green);"></i>
            <span>iqDriver</span>
        </div>
        <div class="header-actions">
            <button id="btnHeaderInstall" class="btn-header-install" onclick="triggerPwaInstallPrompt()">
                <i class="fa-solid fa-download"></i> Install
            </button>
        </div>
    </header>

    <main class="content-area">
        <div class="driver-panel">
            <div style="display:flex; gap:6px;">
                <input type="tel" id="driverPhoneInput" class="form-input" placeholder="No WhatsApp Driver (08xxxx)" readonly>
                <button type="button" onclick="toggleDriverOnlineStatus()" id="btnDriverStatus" style="padding:10px 16px; background:#e74c3c; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:12px;">Offline</button>
            </div>
        </div>

        <div class="map-wrapper">
            <div id="map"></div>
            <button class="btn-my-location" onclick="centerDriverToMyLocation()">
                <i class="fa-solid fa-crosshairs fa-lg"></i>
            </button>
        </div>
    </main>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDQ9CLzERjKUz6ptZYQitr280q38b0LMb0",
        authDomain: "iqbike-1.firebaseapp.com",
        databaseURL: "https://iqbike-1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "iqbike-1",
        storageBucket: "iqbike-1.firebasestorage.app",
        messagingSenderId: "36740451197",
        appId: "1:36740451197:web:c384a12d9f15c75f255a14",
        measurementId: "G-9VEGH3XH9P"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let deferredPwaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPwaInstallPrompt = e;
    });

    function checkIfAppIsAlreadyInstalled() {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isStandalone) {
            const installBtn = document.getElementById('btnHeaderInstall');
            if (installBtn) installBtn.style.display = 'none';
        }
    }

    function triggerPwaInstallPrompt() {
        if (deferredPwaInstallPrompt) {
            deferredPwaInstallPrompt.prompt();
            deferredPwaInstallPrompt.userChoice.then(() => {
                deferredPwaInstallPrompt = null;
            });
        } else {
            showCustomAlert("Pemberitahuan", "✨ Buka menu titik tiga di browser Anda (kanan atas) dan pilih opsi 'Tambahkan ke Layar Utama' atau 'Install Aplikasi'.");
        }
    }

    // Fungsi Suara & Getar untuk Notifikasi Orderan Masuk
    function playNotificationSoundAndVibe() {
        if (navigator.vibrate) {
            navigator.vibrate([300, 150, 300, 150, 300]);
        }
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } catch (e) {}
    }

    function showCustomAlert(title, message) {
        document.getElementById('customAlertTitle').innerText = title;
        document.getElementById('customAlertMessage').innerText = message;
        document.getElementById('customAlertModal').style.display = 'flex';
    }

    function closeCustomAlertModal() {
        document.getElementById('customAlertModal').style.display = 'none';
    }

    let map;
    let driverLat = -7.02443, driverLng = 107.58556;
    let isDriverOnline = false;
    let currentDriverWa = localStorage.getItem('iqbike_driver_wa') || "";
    let activeIncomingOrder = null;
    let hasAlertedCurrentOrder = false;

    function initDriverMap() {
        map = L.map('map', { zoomControl: false }).setView([driverLat, driverLng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                driverLat = pos.coords.latitude;
                driverLng = pos.coords.longitude;
                if (isDriverOnline && currentDriverWa) {
                    syncDriverLocationToCloud();
                }
            }, null, { enableHighAccuracy: true });
        }

        listenCloudForDriver();
    }

    function syncDriverLocationToCloud() {
        if (!currentDriverWa) return;
        db.collection("iqbike_drivers").doc(currentDriverWa).set({
            lat: driverLat,
            lng: driverLng,
            isOnline: isDriverOnline,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(() => {});
    }

    function toggleDriverOnlineStatus() {
        if (!currentDriverWa) {
            currentDriverWa = prompt("Masukkan nomor WhatsApp Anda (08xxxx):");
            if (!currentDriverWa) return;
            localStorage.setItem('iqbike_driver_wa', currentDriverWa);
            document.getElementById('driverPhoneInput').value = currentDriverWa;
        }

        isDriverOnline = !isDriverOnline;
        const btn = document.getElementById('btnDriverStatus');

        if (isDriverOnline) {
            btn.innerText = "Online";
            btn.style.backgroundColor = "var(--primary-green)";
            btn.style.color = "#111";
            syncDriverLocationToCloud();
            showCustomAlert("Status Online", "🟢 Anda sekarang Online dan siap menerima orderan!");
        } else {
            btn.innerText = "Offline";
            btn.style.backgroundColor = "var(--accent-red)";
            btn.style.color = "#fff";
            syncDriverLocationToCloud();
            showCustomAlert("Status Offline", "🔴 Anda sekarang Offline.");
        }
    }

    function listenCloudForDriver() {
        db.collection("iqbike_system").doc("active_order").onSnapshot((doc) => {
            if (doc.exists) {
                const order = doc.data();
                if (order.status === 'WAITING') {
                    activeIncomingOrder = order;
                    const passengerLatLng = L.latLng(order.pickupLat, order.pickupLng);
                    const driverLatLng = L.latLng(driverLat, driverLng);
                    const distMeters = map ? map.distance(driverLatLng, passengerLatLng) : 0;

                    document.getElementById('popupPassengerName').innerText = order.passengerName;
                    document.getElementById('popupPickupText').innerText = order.pickup;
                    document.getElementById('popupDropoffText').innerText = order.dropoff;
                    document.getElementById('popupDriverDistance').innerText = distMeters >= 1000 ? (distMeters/1000).toFixed(1) + " km" : Math.round(distMeters) + " meter";
                    document.getElementById('popupFareText').innerText = `Rp ${(order.fare || 0).toLocaleString('id-ID')}`;

                    if (isDriverOnline && !hasAlertedCurrentOrder) {
                        playNotificationSoundAndVibe();
                        document.getElementById('driverIncomingOrderModal').style.display = 'flex';
                        hasAlertedCurrentOrder = true;
                    }
                } else {
                    closeDriverIncomingModal();
                }
            } else {
                closeDriverIncomingModal();
                activeIncomingOrder = null;
                hasAlertedCurrentOrder = false;
            }
        });
    }

    function closeDriverIncomingModal() {
        document.getElementById('driverIncomingOrderModal').style.display = 'none';
    }

    function driverAcceptOrder() {
        if (!activeIncomingOrder || !currentDriverWa) return;
        
        let acceptedList = activeIncomingOrder.acceptedDrivers || [];
        if (!acceptedList.find(d => d.wa === currentDriverWa)) {
            acceptedList.push({ wa: currentDriverWa, lat: driverLat, lng: driverLng });
        }

        db.collection("iqbike_system").doc("active_order").update({
            acceptedDrivers: acceptedList
        }).then(() => {
            closeDriverIncomingModal();
            showCustomAlert("Berhasil", "✅ Anda telah mengajukan diri untuk mengambil pesanan ini. Tunggu konfirmasi dari penumpang.");
        }).catch(() => {});
    }

    function centerDriverToMyLocation() {
        if (map) map.setView([driverLat, driverLng], 16);
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (currentDriverWa) {
            document.getElementById('driverPhoneInput').value = currentDriverWa;
        }
        initDriverMap();
        checkIfAppIsAlreadyInstalled();
    });
</script>

</body>
</html>
