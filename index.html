<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IqBike - Ojeg Online Realtime</title>
    
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --primary-green: #8cc63f;
            --primary-green-hover: #7ab332;
            --text-light: #ffffff;
            --text-dark: #222222;
            --bg-body: #f4f5f7;
            --border-color: #e0e0e0;
            --accent-red: #eb5757;
            --accent-blue: #2f80ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .header {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-toggle {
            background-color: #2a2a2a;
            border-radius: 20px;
            padding: 3px;
            display: flex;
            gap: 2px;
        }

        .toggle-btn {
            border: none;
            background: transparent;
            color: #888;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
        }

        .toggle-btn.active {
            background-color: var(--primary-green);
            color: var(--text-dark);
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 260px;
            background-color: #e5e3df;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .btn-my-location {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 42px;
            height: 42px;
            background-color: #ffffff;
            color: var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 500;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-my-location.active-blue {
            background-color: var(--accent-blue) !important;
            color: #ffffff !important;
        }

        .content-area {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .status-box {
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }

        .status-online {
            background-color: #eef7e8;
            color: #2e7d32;
            border: 1px solid #c8e6b8;
        }

        .location-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            padding: 10px;
            border: 1px solid var(--border-color);
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .fare-card {
            background: #f8f9fa;
            border: 1px dashed var(--primary-green);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: var(--text-dark);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(140, 198, 63, 0.4);
        }

        .btn-submit:active {
            background-color: var(--primary-green-hover);
        }

        .order-card-driver {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .driver-nav-btn {
            background-color: var(--accent-blue);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div class="brand-title">
            <i class="fa-solid fa-motorcycle" style="color: var(--primary-green);"></i>
            <span>IqBike</span>
        </div>
        <div class="mode-toggle">
            <button id="btnPassenger" class="toggle-btn active" onclick="switchMode('penumpang')">Penumpang</button>
            <button id="btnDriver" class="toggle-btn" onclick="switchMode('driver')">Driver</button>
        </div>
    </header>

    <div class="map-wrapper">
        <div id="map"></div>
        <button id="btnMyLocation" class="btn-my-location" onclick="centerToMyLocation()">
            <i class="fa-solid fa-crosshairs fa-lg"></i>
        </button>
    </div>

    <main class="content-area">
        <!-- MODE PENUMPANG -->
        <div id="passengerView" style="display: flex; flex-direction: column; gap: 12px;">
            <div id="driverStatusBox" class="status-box status-online">
                <i class="fa-solid fa-circle"></i> Driver Tunggal Aktif (Siap Menerima Order)
            </div>

            <div class="location-actions">
                <button class="btn-action" onclick="setPointToCenter('jemput')">
                    <i class="fa-solid fa-map-pin" style="color: var(--accent-red);"></i> Set JEMPUT di Tengah
                </button>
                <button class="btn-action" onclick="setPointToCenter('tujuan')">
                    <i class="fa-solid fa-flag-checkered" style="color: #333;"></i> Set TUJUAN di Tengah
                </button>
            </div>

            <div class="form-group">
                <label class="form-label">Nama Penumpang</label>
                <input type="text" id="passengerName" class="form-input" placeholder="Masukkan nama Anda...">
            </div>

            <div class="form-group">
                <label class="form-label">Lokasi Penjemputan (Bisa Digeser di Peta)</label>
                <input type="text" id="pickupLocation" class="form-input" placeholder="Mencari alamat jemput...">
            </div>

            <div class="form-group">
                <label class="form-label">Lokasi Tujuan (Bisa Digeser di Peta)</label>
                <input type="text" id="dropoffLocation" class="form-input" placeholder="Mencari alamat tujuan...">
            </div>

            <div class="fare-card">
                Estimasi Ongkos: <span id="fareText" style="color: var(--primary-green-hover); font-size: 16px;">Rp 9.000</span>
            </div>

            <button class="btn-submit" type="button" onclick="sendOrder()">
                <i class="fa-solid fa-paper-plane"></i> Kirim Orderan Ke Driver
            </button>
        </div>

        <!-- MODE DRIVER -->
        <div id="driverView" style="display: none; flex-direction: column; gap: 12px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight: 700; font-size: 14px;">
                    <i class="fa-solid fa-list-check"></i> Radar Orderan Masuk Realtime
                </span>
                <span style="background:#8cc63f; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:bold;">ONLINE</span>
            </div>

            <div id="orderListContainer" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="font-size: 12px; color: #888; text-align: center; margin-top: 20px;">Belum ada orderan masuk saat ini...</p>
            </div>
        </div>
    </main>
</div>

<script>
    let map;
    let pickupMarker = null, dropoffMarker = null;
    let pickupCoords = null, dropoffCoords = null;
    let userCurrentLat = -7.02443, userCurrentLng = 107.58556; // Default
    let computedFare = 9000;
    
    // Channel Komunikasi Realtime Antar Tab/Mode
    const orderChannel = new BroadcastChannel('iqbike_orders');

    // Icon Custom
    const redPinIcon = L.divIcon({
        html: '<i class="fa-solid fa-location-dot" style="font-size:32px; color:#eb5757; drop-shadow:0 2px 4px rgba(0,0,0,0.3);"></i>',
        iconSize: [32, 32], iconAnchor: [16, 32], className: 'custom-pin'
    });

    const finishFlagIcon = L.divIcon({
        html: '<i class="fa-solid fa-flag-checkered" style="font-size:24px; color:#111111; background:#ffffff; padding:4px; border-radius:50%; border:2px solid #111;"></i>',
        iconSize: [32, 32], iconAnchor: [16, 16], className: 'custom-flag'
    });

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([userCurrentLat, userCurrentLng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        map.on('move', checkLocationButtonState);

        centerToMyLocation();
        loadOrdersToDriverUI();
    }

    // 1. Dapatkan Lokasi GPS Presisi
    function centerToMyLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                userCurrentLat = pos.coords.latitude;
                userCurrentLng = pos.coords.longitude;
                
                const currentLatLng = L.latLng(userCurrentLat, userCurrentLng);
                map.setView(currentLatLng, 16);

                // Set Default Titik Jemput
                pickupCoords = currentLatLng;
                updateMarker('jemput', currentLatLng);

                // Set Default Titik Tujuan (+300 meter dari jemput)
                if (!dropoffCoords) {
                    dropoffCoords = L.latLng(userCurrentLat + 0.003, userCurrentLng + 0.003);
                    updateMarker('tujuan', dropoffCoords);
                }

                checkLocationButtonState();
            }, () => {
                // Fallback jika GPS tidak aktif
                setupDefaultMarkers();
            }, { enableHighAccuracy: true });
        } else {
            setupDefaultMarkers();
        }
    }

    function setupDefaultMarkers() {
        pickupCoords = L.latLng(userCurrentLat, userCurrentLng);
        dropoffCoords = L.latLng(userCurrentLat + 0.003, userCurrentLng + 0.003);
        updateMarker('jemput', pickupCoords);
        updateMarker('tujuan', dropoffCoords);
    }

    // 2. Pasang Pin yang BISA DIGESER MANUALLY (Draggable)
    function updateMarker(type, latlng) {
        if (type === 'jemput') {
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker(latlng, {icon: redPinIcon, draggable: true}).addTo(map);
            
            // Event ketika Pin Jemput Digeser Pakai Jari
            pickupMarker.on('dragend', function(e) {
                pickupCoords = e.target.getLatLng();
                fetchAddress('jemput', pickupCoords);
                calculateFare();
            });

            fetchAddress('jemput', latlng);
        } else {
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            dropoffMarker = L.marker(latlng, {icon: finishFlagIcon, draggable: true}).addTo(map);
            
            // Event ketika Pin Tujuan Digeser Pakai Jari
            dropoffMarker.on('dragend', function(e) {
                dropoffCoords = e.target.getLatLng();
                fetchAddress('tujuan', dropoffCoords);
                calculateFare();
            });

            fetchAddress('tujuan', latlng);
        }

        calculateFare();
    }

    // Set Pin Sesuai Titik Tengah Peta Saat Ini
    function setPointToCenter(type) {
        const center = map.getCenter();
        if (type === 'jemput') {
            pickupCoords = center;
            updateMarker('jemput', center);
        } else {
            dropoffCoords = center;
            updateMarker('tujuan', center);
        }
    }

    // 3. Konversi Koordinat Jadi Nama Alamat Asli (Reverse Geocoding)
    function fetchAddress(type, latlng) {
        const inputId = (type === 'jemput') ? 'pickupLocation' : 'dropoffLocation';
        document.getElementById(inputId).value = "Mencari nama jalan...";

        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.display_name) {
                    // Ambil ringkasan nama jalan/daerah
                    const address = data.display_name.split(',').slice(0, 3).join(',');
                    document.getElementById(inputId).value = address;
                } else {
                    document.getElementById(inputId).value = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
                }
            })
            .catch(() => {
                document.getElementById(inputId).value = `${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`;
            });
    }

    // 4. Tombol Lokasi Saya Dinamis (Berubah Biru)
    function checkLocationButtonState() {
        const btn = document.getElementById('btnMyLocation');
        const center = map.getCenter();
        const dist = map.distance(center, L.latLng(userCurrentLat, userCurrentLng));

        if (dist < 30) {
            btn.classList.add('active-blue');
        } else {
            btn.classList.remove('active-blue');
        }
    }

    // 5. Hitung Ongkos Sesuai Aturan Presisi
    function calculateFare() {
        if (pickupCoords && dropoffCoords) {
            const distanceInMeters = map.distance(pickupCoords, dropoffCoords);
            let fare = 0;

            if (distanceInMeters <= 3600) {
                fare = 9000; // Minimum 1m - 3.6km
            } else {
                const extraMeters = distanceInMeters - 3600;
                fare = 9000;

                const fullKm = Math.floor(extraMeters / 1000);
                fare += fullKm * 2500;

                const remainderMeters = Math.round(extraMeters % 1000);

                if (remainderMeters >= 1 && remainderMeters <= 199) fare += 500;
                else if (remainderMeters >= 200 && remainderMeters <= 399) fare += 1000;
                else if (remainderMeters >= 400 && remainderMeters <= 599) fare += 1500;
                else if (remainderMeters >= 600 && remainderMeters <= 799) fare += 2000;
                else if (remainderMeters >= 800) fare += 2500;
            }

            computedFare = fare;

            let distanceDisplay = (distanceInMeters < 1000) 
                ? `${Math.round(distanceInMeters)} meter` 
                : `${(distanceInMeters / 1000).toFixed(2)} km`;

            document.getElementById('fareText').innerText = `Rp ${computedFare.toLocaleString('id-ID')} (${distanceDisplay})`;
        }
    }

    // 6. PENUMPANG: Kirim Orderan Ke Radar Driver
    function sendOrder() {
        const name = document.getElementById('passengerName').value || 'Penumpang';
        const pickup = document.getElementById('pickupLocation').value;
        const dropoff = document.getElementById('dropoffLocation').value;

        if (!pickup || !dropoff) {
            alert("Harap tentukan lokasi jemput dan tujuan terlebih dahulu!");
            return;
        }

        const newOrder = {
            id: Date.now(),
            passengerName: name,
            pickup: pickup,
            dropoff: dropoff,
            pickupLat: pickupCoords.lat,
            pickupLng: pickupCoords.lng,
            dropoffLat: dropoffCoords.lat,
            dropoffLng: dropoffCoords.lng,
            fare: computedFare,
            time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
        };

        // Simpan ke Storage Lokal
        let existingOrders = JSON.parse(localStorage.getItem('iqbike_orders') || '[]');
        existingOrders.unshift(newOrder);
        localStorage.setItem('iqbike_orders', JSON.stringify(existingOrders));

        // Kirim Sinyal Realtime
        orderChannel.postMessage(newOrder);

        alert("Orderan Berhasil Dikirim! Silakan Buka Tab 'Driver' Untuk Melihat Radar Masuk.");
        
        // Buka WA sebagai cadangan notifikasi
        const textWA = `Orderan Baru IqBike:%0ANama: ${name}%0AJemput: ${pickup}%0ATujuan: ${dropoff}%0AOngkos: Rp ${computedFare.toLocaleString('id-ID')}`;
        window.open(`https://wa.me/6281234567890?text=${textWA}`, '_blank');

        loadOrdersToDriverUI();
    }

    // 7. DRIVER: Tampilkan Orderan Di Radar
    function loadOrdersToDriverUI() {
        const container = document.getElementById('orderListContainer');
        const orders = JSON.parse(localStorage.getItem('iqbike_orders') || '[]');

        if (orders.length === 0) {
            container.innerHTML = '<p style="font-size: 12px; color: #888; text-align: center; margin-top: 20px;">Belum ada orderan masuk saat ini...</p>';
            return;
        }

        container.innerHTML = '';
        orders.forEach(item => {
            const gmapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${item.pickupLat},${item.pickupLng}&destination=${item.dropoffLat},${item.dropoffLng}&travelmode=bicycling`;

            const card = document.createElement('div');
            card.className = 'order-card-driver';
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; font-weight:700;">
                    <span><i class="fa-solid fa-user"></i> ${item.passengerName} <small style="color:#888; font-weight:normal;">(${item.time})</small></span>
                    <span style="color: var(--primary-green-hover); font-size:15px;">Rp ${item.fare.toLocaleString('id-ID')}</span>
                </div>
                <div style="font-size: 12px; color: #444; display:flex; flex-direction:column; gap:6px; background:#f9f9f9; padding:8px; border-radius:6px;">
                    <p><strong><i class="fa-solid fa-location-dot" style="color:#eb5757;"></i> Jemput:</strong> ${item.pickup}</p>
                    <p><strong><i class="fa-solid fa-flag-checkered"></i> Antar:</strong> ${item.dropoff}</p>
                </div>
                <a href="${gmapsUrl}" target="_blank" class="driver-nav-btn">
                    <i class="fa-solid fa-route"></i> Navigasi Rute Google Maps
                </a>
            `;
            container.appendChild(card);
        });
    }

    // Dengarkan orderan baru secara realtime
    orderChannel.onmessage = function() {
        loadOrdersToDriverUI();
    };

    function switchMode(mode) {
        const pView = document.getElementById('passengerView');
        const dView = document.getElementById('driverView');
        const btnP = document.getElementById('btnPassenger');
        const btnD = document.getElementById('btnDriver');

        if (mode === 'driver') {
            pView.style.display = 'none';
            dView.style.display = 'flex';
            btnP.classList.remove('active');
            btnD.classList.add('active');
            loadOrdersToDriverUI();
        } else {
            pView.style.display = 'flex';
            dView.style.display = 'none';
            btnP.classList.add('active');
            btnD.classList.remove('active');
        }
    }

    window.onload = initMap;
</script>

</body>
</html>
