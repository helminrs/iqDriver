<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IqBike Driver - Layanan Ojeg WA</title>
    
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet OpenStreetMap CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --primary-green: #8cc63f;
            --primary-green-hover: #7ab332;
            --text-light: #ffffff;
            --text-dark: #222222;
            --bg-body: #f4f5f7;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Container Utama Responsif */
        .app-container {
            width: 100%;
            max-width: 480px; /* Ukuran ideal layar smartphone */
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Header Top Bar */
        .header {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Toggle Mode Penumpang / Driver */
        .mode-toggle {
            background-color: #2a2a2a;
            border-radius: 20px;
            padding: 3px;
            display: flex;
            gap: 2px;
        }

        .toggle-btn {
            border: none;
            background: transparent;
            color: #888;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background-color: var(--primary-green);
            color: var(--text-dark);
        }

        /* Map Section */
        .map-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            background-color: #e5e3df;
            z-index: 1;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 500;
            pointer-events: none;
        }

        /* Content Area & Form */
        .content-area {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex: 1;
        }

        /* Tab Layanan */
        .service-card {
            background-color: #eef7e8;
            border: 1px solid #c8e6b8;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-icon {
            background: var(--primary-green);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            font-size: 18px;
        }

        .service-details h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .service-details p {
            font-size: 12px;
            color: #666;
        }

        /* Button Group JEMPUT / TUJUAN */
        .location-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            padding: 10px;
            border: 1px solid var(--border-color);
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .btn-action:active {
            background: #e2e8f0;
        }

        /* Form Inputs */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: var(--primary-green);
        }

        .form-textarea {
            resize: none;
            height: 60px;
        }

        /* Estimasi Box */
        .estimation-box {
            background-color: #eef7e8;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .estimation-title {
            font-size: 12px;
            color: #555;
        }

        .estimation-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
        }

        /* Tombol Utama WA */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: var(--text-dark);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(140, 198, 63, 0.4);
            transition: background 0.2s;
            margin-bottom: 16px;
        }

        .btn-submit:active {
            background-color: var(--primary-green-hover);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header Utama -->
    <header class="header">
        <div class="brand-title">
            <i class="fa-solid fa-motorcycle" style="color: var(--primary-green);"></i>
            <span>IqBike</span>
        </div>
        <div class="mode-toggle">
            <button class="toggle-btn active" onclick="switchMode('penumpang')">Penumpang</button>
            <button class="toggle-btn" onclick="switchMode('driver')">Driver</button>
        </div>
    </header>

    <!-- Area Peta Leaflet -->
    <div class="map-wrapper">
        <div class="map-badge"><i class="fa-solid fa-location-dot"></i> Peta Lokasi</div>
        <div id="map"></div>
    </div>

    <!-- Area Form Pemesanan -->
    <main class="content-area">
        <!-- Kartu Jenis Layanan -->
        <div class="service-card">
            <div class="service-icon">
                <i class="fa-solid fa-motorcycle"></i>
            </div>
            <div class="service-details">
                <h4>Ojeg Motor (iqBike)</h4>
                <p>Tarif Pas (Argo Buka)</p>
            </div>
        </div>

        <!-- Tombol Quick Action Lokasi -->
        <div class="location-actions">
            <button class="btn-action" onclick="setPickupPoint()">
                <i class="fa-solid fa-map-pin" style="color: #2f80ed;"></i> Atur Titik JEMPUT
            </button>
            <button class="btn-action" onclick="setDropoffPoint()">
                <i class="fa-solid fa-flag-checkered" style="color: #eb5757;"></i> Atur Titik TUJUAN
            </button>
        </div>

        <!-- Input Nama Penumpang -->
        <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-user"></i> Nama Penumpang</label>
            <input type="text" id="passengerName" class="form-input" placeholder="Masukkan nama Anda..." value="Penumpang WA">
        </div>

        <!-- Input Cari Tempat -->
        <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-magnifying-glass"></i> Cari Nama Tempat / Geografi</label>
            <input type="text" id="searchPlace" class="form-input" placeholder="Ketik lokasi (misal: SMAN 1 Banjar)">
        </div>

        <!-- Input Detail Penjemputan -->
        <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-circle-dot" style="color: #2f80ed;"></i> Lokasi Penjemputan</label>
            <input type="text" id="pickupLocation" class="form-input" placeholder="Detail titik penjemputan...">
        </div>

        <!-- Input Detail Tujuan -->
        <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-location-dot" style="color: #eb5757;"></i> Lokasi Tujuan</label>
            <input type="text" id="dropoffLocation" class="form-input" placeholder="Detail lokasi tujuan...">
        </div>

        <!-- Metode Pembayaran -->
        <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-wallet"></i> Metode Pembayaran</label>
            <select id="paymentMethod" class="form-select">
                <option value="Tunai (Cash)">Tunai (Cash)</option>
                <option value="Transfer / QRIS">Transfer / QRIS</option>
            </select>
        </div>

        <!-- Catatan Untuk Driver -->
        <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-pen"></i> Catatan Untuk Driver</label>
            <textarea id="driverNote" class="form-textarea" placeholder="Contoh: Tunggu di depan gerbang utama">-</textarea>
        </div>

        <!-- Box Estimasi Jarak & Tarif -->
        <div class="estimation-box">
            <span class="estimation-title">Estimasi Jarak & Tarif Ojeg Motor:</span>
            <span class="estimation-value" id="fareEstimate">0.0 km — Rp 0</span>
        </div>

        <!-- Tombol Kirim WA -->
        <button class="btn-submit" onclick="sendToWhatsApp()">
            <i class="fa-brands fa-whatsapp fa-lg"></i> Cari Driver Ojeg WA
        </button>
    </main>
</div>

<script>
    // Inisialisasi Peta Leaflet
    let map = L.map('map', {
        zoomControl: false
    }).setView([-7.3686, 108.5332], 14); // Koordinat Default (Banjar)

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Marker Peta
    let marker = L.marker([-7.3686, 108.5332], {draggable: true}).addTo(map);

    marker.on('dragend', function(e) {
        let position = marker.getLatLng();
        console.log("Lokasi dipilih:", position.lat, position.lng);
    });

    // Fitur Switch Mode Penumpang / Driver
    function switchMode(mode) {
        const buttons = document.querySelectorAll('.toggle-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        
        if(mode === 'penumpang') {
            buttons[0].classList.add('active');
            alert("Mode Penumpang Aktif");
        } else {
            buttons[1].classList.add('active');
            alert("Mode Driver Aktif");
        }
    }

    function setPickupPoint() {
        alert("Silakan pilih/geser marker pada peta untuk menentukan Titik Jemput.");
    }

    function setDropoffPoint() {
        alert("Silakan pilih/geser marker pada peta untuk menentukan Titik Tujuan.");
    }

    // Fungsi Kirim Orderan ke WhatsApp
    function sendToWhatsApp() {
        const name = document.getElementById('passengerName').value || 'Penumpang';
        const pickup = document.getElementById('pickupLocation').value || 'Belum diisi';
        const dropoff = document.getElementById('dropoffLocation').value || 'Belum diisi';
        const payment = document.getElementById('paymentMethod').value;
        const note = document.getElementById('driverNote').value;

        const message = `Halo Driver IqBike, saya ingin pesan Ojeg Motor:%0A%0A` +
            `*Nama:* ${encodeURIComponent(name)}%0A` +
            `*Jemput:* ${encodeURIComponent(pickup)}%0A` +
            `*Tujuan:* ${encodeURIComponent(dropoff)}%0A` +
            `*Pembayaran:* ${encodeURIComponent(payment)}%0A` +
            `*Catatan:* ${encodeURIComponent(note)}`;

        // Ganti nomor dibawah dengan nomor WhatsApp Admin/Driver tujuan
        const phoneNumber = "6281234567890"; 
        window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
    }
</script>

</body>
</html>
