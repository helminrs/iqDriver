<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IqBike - System Hybrid inDrive Style</title>
    
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --primary-green: #8cc63f;
            --primary-green-hover: #7ab332;
            --text-light: #ffffff;
            --text-dark: #222222;
            --bg-body: #f4f5f7;
            --border-color: #e0e0e0;
            --accent-red: #eb5757;
            --accent-blue: #2f80ed;
            --accent-orange: #f2994a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .login-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: white;
            text-align: center;
        }

        .login-card {
            background: #222;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .role-btn {
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .role-passenger { background: var(--primary-green); color: #111; }
        .role-driver { background: #333; color: #fff; border: 1px solid #555; }

        .header {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-switch-role {
            background: #2a2a2a;
            color: var(--primary-green);
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 270px;
            background-color: #e5e3df;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .btn-my-location {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 42px;
            height: 42px;
            background-color: #ffffff;
            color: var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            z-index: 500;
            cursor: pointer;
            border: none;
        }

        .content-area {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .status-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-online { background-color: #eef7e8; color: #2e7d32; border: 1px solid #c8e6b8; }
        .status-process { background-color: #e3f2fd; color: #1565c0; border: 1px solid #bbdefb; }
        .status-arrived { background-color: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; }

        .location-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            padding: 10px;
            border: 1px solid var(--border-color);
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .fare-card {
            background: #f8f9fa;
            border: 1px dashed var(--primary-green);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }

        .btn-reset {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: var(--text-dark);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .order-card-driver {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            background: #fff;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-nav-gmaps {
            width: 100%;
            padding: 10px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .driver-step-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-accept { background-color: var(--accent-blue); }
        .btn-arrived { background-color: var(--accent-orange); }
        .btn-trip { background-color: var(--primary-green); color: #111; }
        .btn-finish { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="loginOverlay" class="login-overlay">
        <i class="fa-solid fa-motorcycle" style="font-size: 48px; color: var(--primary-green); margin-bottom: 12px;"></i>
        <h2 style="font-size: 22px; font-weight: 800;">Selamat Datang di IqBike</h2>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 20px;">Pilih jenis akun/peran Anda untuk melanjutkan</p>
        
        <div class="login-card">
            <button class="role-btn role-passenger" onclick="selectUserRole('penumpang')">
                <i class="fa-solid fa-user"></i> Masuk Sebagai PENUMPANG
            </button>
            <button class="role-btn role-driver" onclick="selectUserRole('driver')">
                <i class="fa-solid fa-id-card"></i> Masuk Sebagai DRIVER
            </button>
        </div>
    </div>

    <header class="header">
        <div class="brand-title">
            <i class="fa-solid fa-motorcycle" style="color: var(--primary-green);"></i>
            <span>IqBike</span>
        </div>
        <button class="btn-switch-role" onclick="showLoginOverlay()">
            <i class="fa-solid fa-right-from-bracket"></i> <span id="currentRoleText">Ganti Mode</span>
        </button>
    </header>

    <div class="map-wrapper">
        <div id="map"></div>
        <button id="btnMyLocation" class="btn-my-location" onclick="centerToMyLocation()">
            <i class="fa-solid fa-crosshairs fa-lg"></i>
        </button>
    </div>

    <main class="content-area">
        <!-- VIEW PENUMPANG -->
        <div id="passengerView" style="display: none; flex-direction: column; gap: 12px;">
            <div id="driverStatusBox" class="status-box status-online">
                <i class="fa-solid fa-circle"></i> Memeriksa Status Driver...
            </div>

            <div class="location-actions">
                <button id="btnSetJemput" class="btn-action" onclick="setPointToCenter('jemput')">
                    <i class="fa-solid fa-map-pin" style="color: var(--accent-red);"></i> Set JEMPUT di Tengah
                </button>
                <button id="btnSetTujuan" class="btn-action" onclick="setPointToCenter('tujuan')">
                    <i class="fa-solid fa-flag-checkered" style="color: #333;"></i> Set TUJUAN di Tengah
                </button>
            </div>

            <div class="form-group">
                <label class="form-label">Nama Penumpang</label>
                <input type="text" id="passengerName" class="form-input" placeholder="Masukkan nama Anda...">
            </div>

            <div class="form-group">
                <label class="form-label">Lokasi Penjemputan <span id="pickupLockLabel" style="color:red; font-size:10px;"></span></label>
                <input type="text" id="pickupLocation" class="form-input" placeholder="Mencari alamat jemput...">
            </div>

            <div class="form-group">
                <label class="form-label">Lokasi Tujuan (Bisa Diubah Saat Perjalanan)</label>
                <input type="text" id="dropoffLocation" class="form-input" placeholder="Mencari alamat tujuan...">
            </div>

            <div class="fare-card">
                Estimasi Total Ongkos: <span id="fareText" style="color: var(--primary-green-hover); font-size: 15px;">Rp 9.000</span>
            </div>

            <button type="button" class="btn-reset" onclick="resetAddressAndFare()">
                <i class="fa-solid fa-rotate-left"></i> Batal Ubah & Batal Ongkos Tambahan
            </button>

            <button id="btnSendOrder" class="btn-submit" type="button" onclick="sendOrder()">
                <i class="fa-solid fa-paper-plane"></i> Kirim Orderan Ke Driver
            </button>
        </div>

        <!-- VIEW DRIVER -->
        <div id="driverView" style="display: none; flex-direction: column; gap: 12px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-weight: 700; font-size: 14px;">
                    <i class="fa-solid fa-list-check"></i> Radar Orderan Realtime
                </span>
                <span style="background:#8cc63f; color:#111; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:bold;">
                    <i class="fa-solid fa-signal"></i> GPS ONLINE
                </span>
            </div>

            <div id="orderListContainer" style="display: flex; flex-direction: column; gap: 10px;">
                <p style="font-size: 12px; color: #888; text-align: center; margin-top: 20px;">Belum ada orderan masuk saat ini...</p>
            </div>
        </div>
    </main>
</div>

<script>
    let map;
    let pickupMarker = null, dropoffMarker = null;
    let driverLiveMarker = null, passengerPhoneMarker = null;
    let pickupCoords = null, dropoffCoords = null;
    let userCurrentLat = -7.02443, userCurrentLng = 107.58556;
    let userRole = null; 
    let computedTotalFare = 9000;

    const orderChannel = new BroadcastChannel('iqbike_system');

    const redPinIcon = L.divIcon({
        html: '<i class="fa-solid fa-location-dot" style="font-size:24px; color:#eb5757;"></i>',
        iconSize: [24, 24], iconAnchor: [12, 24], className: 'custom-pin'
    });

    const finishFlagIcon = L.divIcon({
        html: '<i class="fa-solid fa-flag-checkered" style="font-size:20px; color:#111; background:#fff; padding:2px; border-radius:50%; border:1px solid #111;"></i>',
        iconSize: [22, 22], iconAnchor: [11, 11], className: 'custom-flag'
    });

    const driverMotorIcon = L.divIcon({
        html: '<i class="fa-solid fa-motorcycle" style="font-size:12px; color:#fff; background:#8cc63f; padding:4px; border-radius:50%; border:1px solid #121212; box-shadow:0 1px 4px rgba(0,0,0,0.4);"></i>',
        iconSize: [22, 22], iconAnchor: [11, 11], className: 'driver-motor-icon'
    });

    const passengerPhoneIcon = L.divIcon({
        html: '<i class="fa-solid fa-user-large" style="font-size:11px; color:#fff; background:#2f80ed; padding:4px; border-radius:50%; border:1px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,0.4);"></i>',
        iconSize: [22, 22], iconAnchor: [11, 11], className: 'passenger-phone-icon'
    });

    function triggerVibration(pattern) {
        if ("vibrate" in navigator) navigator.vibrate(pattern);
    }

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([userCurrentLat, userCurrentLng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        startLiveGpsTracking();
        centerToMyLocation();
    }

    function showLoginOverlay() {
        document.getElementById('loginOverlay').style.display = 'flex';
    }

    function selectUserRole(role) {
        userRole = role;
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('currentRoleText').innerText = (role === 'penumpang') ? 'Mode: Penumpang' : 'Mode: Driver';

        if (role === 'penumpang') {
            document.getElementById('passengerView').style.display = 'flex';
            document.getElementById('driverView').style.display = 'none';
            updatePassengerAppUI();
        } else {
            document.getElementById('passengerView').style.display = 'none';
            document.getElementById('driverView').style.display = 'flex';
            updateDriverAppUI();
        }
    }

    function startLiveGpsTracking() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                const currentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                userCurrentLat = currentPos.lat;
                userCurrentLng = currentPos.lng;

                if (userRole === 'penumpang') {
                    localStorage.setItem('iqbike_passenger_gps', JSON.stringify(currentPos));
                } else if (userRole === 'driver') {
                    localStorage.setItem('iqbike_driver_gps', JSON.stringify(currentPos));
                }

                orderChannel.postMessage({ type: 'GPS_UPDATE' });
                renderAllLiveMarkers();
            }, null, { enableHighAccuracy: true });
        }
    }

    function renderAllLiveMarkers() {
        const driverGps = JSON.parse(localStorage.getItem('iqbike_driver_gps'));
        if (driverGps) {
            if (!driverLiveMarker) {
                driverLiveMarker = L.marker([driverGps.lat, driverGps.lng], {icon: driverMotorIcon, zIndexOffset: 1000}).addTo(map);
            } else {
                driverLiveMarker.setLatLng([driverGps.lat, driverGps.lng]);
            }
        }

        const passengerGps = JSON.parse(localStorage.getItem('iqbike_passenger_gps'));
        if (passengerGps) {
            if (!passengerPhoneMarker) {
                passengerPhoneMarker = L.marker([passengerGps.lat, passengerGps.lng], {icon: passengerPhoneIcon, zIndexOffset: 900}).addTo(map);
            } else {
                passengerPhoneMarker.setLatLng([passengerGps.lat, passengerGps.lng]);
            }
        }
    }

    function centerToMyLocation() {
        const currentLatLng = L.latLng(userCurrentLat, userCurrentLng);
        map.setView(currentLatLng, 16);

        if (!pickupCoords) {
            pickupCoords = currentLatLng;
            updateMarker('jemput', currentLatLng);
        }
        if (!dropoffCoords) {
            dropoffCoords = L.latLng(userCurrentLat + 0.003, userCurrentLng + 0.003);
            updateMarker('tujuan', dropoffCoords);
        }
    }

    function updateMarker(type, latlng) {
        const order = JSON.parse(localStorage.getItem('iqbike_active_order'));
        const isLocked = (order && order.status !== 'WAITING');

        if (type === 'jemput') {
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker(latlng, {icon: redPinIcon, draggable: !isLocked}).addTo(map);
            if (!isLocked) {
                pickupMarker.on('dragend', (e) => {
                    pickupCoords = e.target.getLatLng();
                    fetchAddress('jemput', pickupCoords);
                    calculateFare();
                });
            }
            fetchAddress('jemput', latlng);
        } else {
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            dropoffMarker = L.marker(latlng, {icon: finishFlagIcon, draggable: true}).addTo(map);
            dropoffMarker.on('dragend', (e) => {
                dropoffCoords = e.target.getLatLng();
                fetchAddress('tujuan', dropoffCoords);
                calculateFare();
            });
            fetchAddress('tujuan', latlng);
        }
        calculateFare();
    }

    function setPointToCenter(type) {
        const center = map.getCenter();
        if (type === 'jemput') { pickupCoords = center; updateMarker('jemput', center); }
        else { dropoffCoords = center; updateMarker('tujuan', center); }
    }

    function fetchAddress(type, latlng) {
        const inputId = (type === 'jemput') ? 'pickupLocation' : 'dropoffLocation';
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`)
            .then(res => res.json())
            .then(data => {
                if (data && data.display_name) {
                    document.getElementById(inputId).value = data.display_name.split(',').slice(0, 3).join(',');
                }
            }).catch(() => {});
    }

    function computeDistanceFare(distanceInMeters) {
        if (distanceInMeters <= 3600) return 9000;
        const extraMeters = distanceInMeters - 3600;
        let fare = 9000;
        const fullKm = Math.floor(extraMeters / 1000);
        fare += fullKm * 2500;
        const remainderMeters = Math.round(extraMeters % 1000);
        if (remainderMeters >= 1 && remainderMeters <= 199) fare += 500;
        else if (remainderMeters >= 200 && remainderMeters <= 399) fare += 1000;
        else if (remainderMeters >= 400 && remainderMeters <= 599) fare += 1500;
        else if (remainderMeters >= 600 && remainderMeters <= 799) fare += 2000;
        else if (remainderMeters >= 800) fare += 2500;
        return fare;
    }

    function calculateFare() {
        if (!pickupCoords || !dropoffCoords) return;

        const order = JSON.parse(localStorage.getItem('iqbike_active_order'));

        if (!order || order.status === 'WAITING') {
            const distMeters = map.distance(pickupCoords, dropoffCoords);
            computedTotalFare = computeDistanceFare(distMeters);
            document.getElementById('fareText').innerText = `Rp ${computedTotalFare.toLocaleString('id-ID')}`;
        } else {
            const initialDrop = L.latLng(order.initialDropoffLat, order.initialDropoffLng);
            const baseDist = map.distance(L.latLng(order.pickupLat, order.pickupLng), initialDrop);
            const baseFare = computeDistanceFare(baseDist);

            const extraDist = map.distance(initialDrop, dropoffCoords);
            let extraFare = 0;

            if (extraDist > 100) {
                extraFare = computeDistanceFare(extraDist);
            }

            computedTotalFare = baseFare + extraFare;

            if (extraFare > 0) {
                document.getElementById('fareText').innerText = `Rp ${computedTotalFare.toLocaleString('id-ID')} (+Tambahan Ubah Tujuan: Rp ${extraFare.toLocaleString('id-ID')})`;
            } else {
                document.getElementById('fareText').innerText = `Rp ${computedTotalFare.toLocaleString('id-ID')}`;
            }
        }
    }

    function resetAddressAndFare() {
        const order = JSON.parse(localStorage.getItem('iqbike_active_order'));
        if (!order || order.status === 'WAITING') {
            const currentLatLng = L.latLng(userCurrentLat, userCurrentLng);
            pickupCoords = currentLatLng;
            dropoffCoords = L.latLng(userCurrentLat + 0.003, userCurrentLng + 0.003);
            updateMarker('jemput', pickupCoords);
            updateMarker('tujuan', dropoffCoords);
        } else {
            dropoffCoords = L.latLng(order.initialDropoffLat, order.initialDropoffLng);
            updateMarker('tujuan', dropoffCoords);
        }
        calculateFare();
        alert("Batal penyesuaian alamat. Kembali ke lokasi & ongkos awal.");
    }

    function sendOrder() {
        const name = document.getElementById('passengerName').value || 'Penumpang';
        const pickup = document.getElementById('pickupLocation').value;
        const dropoff = document.getElementById('dropoffLocation').value;

        let order = JSON.parse(localStorage.getItem('iqbike_active_order'));

        if (!order) {
            order = {
                id: Date.now(), passengerName: name, pickup, dropoff,
                pickupLat: pickupCoords.lat, pickupLng: pickupCoords.lng,
                dropoffLat: dropoffCoords.lat, dropoffLng: dropoffCoords.lng,
                initialDropoffLat: dropoffCoords.lat, initialDropoffLng: dropoffCoords.lng,
                fare: computedTotalFare, status: 'WAITING', routeUpdated: false,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };
            alert("Orderan dikirim ke Radar Driver!");
        } else {
            order.dropoff = dropoff;
            order.dropoffLat = dropoffCoords.lat;
            order.dropoffLng = dropoffCoords.lng;
            order.fare = computedTotalFare;
            order.routeUpdated = true;
            alert(`Perubahan tujuan disetujui! Ongkos diperbarui menjadi Rp ${computedTotalFare.toLocaleString('id-ID')}`);
        }

        localStorage.setItem('iqbike_active_order', JSON.stringify(order));
        orderChannel.postMessage({ type: 'NEW_ORDER' });
        triggerVibration([200, 100, 200]);
        
        updatePassengerAppUI();
        updateDriverAppUI();
    }

    // OPERASIONAL STEP LENGKAP BEREVOLUSI SECARA BERURUTAN
    function setOrderStatus(newStatus) {
        let order = JSON.parse(localStorage.getItem('iqbike_active_order'));
        if (!order) return;

        if (newStatus === 'HEADING_PICKUP' && !order.initialDropoffLat) {
            order.initialDropoffLat = order.dropoffLat;
            order.initialDropoffLng = order.dropoffLng;
        }

        if (newStatus === 'FINISHED') {
            alert(`Orderan Selesai!\nTotal Pendapatan: Rp ${order.fare.toLocaleString('id-ID')}\nDisimpan ke Riwayat.`);
            localStorage.removeItem('iqbike_active_order');
        } else {
            order.status = newStatus;
            localStorage.setItem('iqbike_active_order', JSON.stringify(order));
        }

        orderChannel.postMessage({ type: 'STATUS_CHANGE' });
        triggerVibration([500]);
        
        updateDriverAppUI();
        updatePassengerAppUI();
    }

    function openGoogleMapsNav(targetLat, targetLng) {
        const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${targetLat},${targetLng}&travelmode=bicycling`;
        window.open(gmapsUrl, '_blank');
    }

    function updatePassengerAppUI() {
        const statusBox = document.getElementById('driverStatusBox');
        const order = JSON.parse(localStorage.getItem('iqbike_active_order'));
        const btnSend = document.getElementById('btnSendOrder');

        if (!order) {
            statusBox.className = "status-box status-online";
            statusBox.innerHTML = `<i class="fa-solid fa-circle"></i> Siap Menerima Order`;
            btnSend.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Kirim Orderan Ke Driver`;
            return;
        }

        if (order.status !== 'WAITING') {
            btnSend.innerHTML = `<i class="fa-solid fa-circle-check"></i> Setujui & Perbarui Tujuan Baru`;
        }

        if (order.status === 'WAITING') {
            statusBox.className = "status-box status-process";
            statusBox.innerHTML = `<i class="fa-solid fa-clock"></i> Menunggu Konfirmasi Driver...`;
        } else if (order.status === 'HEADING_PICKUP') {
            statusBox.className = "status-box status-process";
            statusBox.innerHTML = `<i class="fa-solid fa-motorcycle"></i> Driver Sedang Menuju Lokasi Jemput!`;
        } else if (order.status === 'ARRIVED') {
            statusBox.className = "status-box status-arrived";
            statusBox.innerHTML = `<i class="fa-solid fa-location-dot"></i> Driver Telah Tiba di Titik Jemput!`;
        } else if (order.status === 'ON_TRIP') {
            statusBox.className = "status-box status-process";
            statusBox.innerHTML = `<i class="fa-solid fa-route"></i> Dalam Perjalanan Menuju Tujuan...`;
        }
    }

    function updateDriverAppUI() {
        const container = document.getElementById('orderListContainer');
        const order = JSON.parse(localStorage.getItem('iqbike_active_order'));

        if (!order) {
            container.innerHTML = '<p style="font-size: 12px; color: #888; text-align: center; margin-top: 20px;">Belum ada orderan masuk...</p>';
            return;
        }

        let actionBtnHTML = '';
        let navBtnHTML = '';

        // FIX LOGIKA BERURUTAN
        if (order.status === 'WAITING') {
            actionBtnHTML = `
                <button class="driver-step-btn btn-accept" onclick="setOrderStatus('HEADING_PICKUP')">
                    <i class="fa-solid fa-route"></i> Terima Order & OTW Jemput
                </button>`;
        } else if (order.status === 'HEADING_PICKUP') {
            navBtnHTML = `
                <button class="btn-nav-gmaps" onclick="openGoogleMapsNav(${order.pickupLat}, ${order.pickupLng})">
                    <i class="fa-solid fa-location-arrow"></i> Navigasi Buka Google Maps (Rute Jemput)
                </button>`;
            actionBtnHTML = `
                <button class="driver-step-btn btn-arrived" onclick="setOrderStatus('ARRIVED')">
                    <i class="fa-solid fa-location-dot"></i> Saya Sudah Tiba di Titik Jemput
                </button>`;
        } else if (order.status === 'ARRIVED') {
            actionBtnHTML = `
                <button class="driver-step-btn btn-trip" onclick="setOrderStatus('ON_TRIP')">
                    <i class="fa-solid fa-motorcycle"></i> Mulai Perjalanan (Berangkat)
                </button>`;
        } else if (order.status === 'ON_TRIP') {
            navBtnHTML = `
                <button class="btn-nav-gmaps" onclick="openGoogleMapsNav(${order.dropoffLat}, ${order.dropoffLng})">
                    <i class="fa-solid fa-location-arrow"></i> Navigasi Buka Google Maps (Rute Tujuan)
                </button>`;
            actionBtnHTML = `
                <button class="driver-step-btn btn-finish" onclick="setOrderStatus('FINISHED')">
                    <i class="fa-solid fa-circle-check"></i> Selesaikan Perjalanan
                </button>`;
        }

        let routeAlertHTML = '';
        if (order.routeUpdated) {
            routeAlertHTML = `
                <div style="background:#fff3cd; color:#856404; padding:6px 10px; border-radius:6px; font-size:11px; font-weight:bold; border:1px solid #ffeeba;">
                    <i class="fa-solid fa-triangle-exclamation"></i> Tujuan Diperbarui Penumpang!
                </div>
            `;
        }

        container.innerHTML = `
            <div class="order-card-driver">
                <div style="display:flex; justify-content:space-between; font-weight:700;">
                    <span><i class="fa-solid fa-user"></i> ${order.passengerName}</span>
                    <span style="color: var(--primary-green-hover); font-size:16px;">Rp ${order.fare.toLocaleString('id-ID')}</span>
                </div>
                ${routeAlertHTML}
                <div style="font-size:12px; background:#f9f9f9; padding:8px; border-radius:6px; display:flex; flex-direction:column; gap:4px;">
                    <p><strong style="color:#eb5757;"><i class="fa-solid fa-location-dot"></i> Jemput:</strong> ${order.pickup}</p>
                    <p><strong style="color:#111;"><i class="fa-solid fa-flag-checkered"></i> Tujuan Terupdate:</strong> ${order.dropoff}</p>
                </div>
                ${navBtnHTML}
                ${actionBtnHTML}
            </div>
        `;
    }

    orderChannel.onmessage = function() {
        renderAllLiveMarkers();
        calculateFare();
        updatePassengerAppUI();
        updateDriverAppUI();
    };

    window.onload = function() {
        initMap();
        showLoginOverlay();
    };
</script>

</body>
</html>
