<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IqBike - Ojeg WA</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #121212;
            --primary-green: #8cc63f;
            --primary-green-hover: #7ab332;
            --text-light: #ffffff;
            --text-dark: #222222;
            --bg-body: #f4f5f7;
            --border-color: #e0e0e0;
            --accent-red: #eb5757;
            --accent-blue: #2f80ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        .header {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 250px;
            background-color: #e5e3df;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .btn-my-location {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 500;
            cursor: pointer;
            border: none;
        }

        .content-area {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .location-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            padding: 10px;
            border: 1px solid var(--border-color);
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: var(--text-dark);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(140, 198, 63, 0.4);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header class="header">
        <div class="brand-title">
            <i class="fa-solid fa-motorcycle" style="color: var(--primary-green);"></i>
            <span>IqBike</span>
        </div>
        <span style="font-size: 12px; color: #8cc63f; font-weight: 600;">Ojeg WhatsApp</span>
    </header>

    <div class="map-wrapper">
        <div id="map"></div>
        <button class="btn-my-location" onclick="centerToMyLocation()">
            <i class="fa-solid fa-crosshairs" style="color: var(--accent-red);"></i>
        </button>
    </div>

    <main class="content-area">
        <div class="location-actions">
            <button class="btn-action" onclick="setPoint('jemput')">
                <i class="fa-solid fa-map-pin" style="color: var(--accent-blue);"></i> Set JEMPUT
            </button>
            <button class="btn-action" onclick="setPoint('tujuan')">
                <i class="fa-solid fa-flag-checkered" style="color: var(--accent-red);"></i> Set TUJUAN
            </button>
        </div>

        <div class="form-group">
            <label class="form-label">Nama Penumpang</label>
            <input type="text" id="passengerName" class="form-input" placeholder="Masukkan nama...">
        </div>

        <div class="form-group">
            <label class="form-label">Cari Alamat</label>
            <input type="text" class="form-input" placeholder="Ketik lokasi..." onchange="searchLocation(this.value)">
        </div>

        <div class="form-group">
            <label class="form-label">Lokasi Penjemputan</label>
            <input type="text" id="pickupLocation" class="form-input" readonly placeholder="Klik 'Set JEMPUT' di peta">
        </div>

        <div class="form-group">
            <label class="form-label">Lokasi Tujuan</label>
            <input type="text" id="dropoffLocation" class="form-input" readonly placeholder="Klik 'Set TUJUAN' di peta">
        </div>

        <button class="btn-submit" onclick="sendOrderWA()">
            <i class="fa-brands fa-whatsapp fa-lg"></i> Pesan via WhatsApp
        </button>
    </main>
</div>

<script>
    let map, marker;
    let pickupCoords = null, dropoffCoords = null;

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([-7.3686, 108.5332], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        marker = L.marker([-7.3686, 108.5332], {draggable: true}).addTo(map);
        centerToMyLocation();
    }

    function centerToMyLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                map.setView([lat, lng], 16);
                marker.setLatLng([lat, lng]);
            });
        }
    }

    function setPoint(type) {
        const center = map.getCenter();
        const coordString = `${center.lat.toFixed(5)},${center.lng.toFixed(5)}`;
        if (type === 'jemput') {
            pickupCoords = coordString;
            document.getElementById('pickupLocation').value = coordString;
        } else {
            dropoffCoords = coordString;
            document.getElementById('dropoffLocation').value = coordString;
        }
    }

    function searchLocation(query) {
        if (!query) return;
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
            .then(res => res.json())
            .then(data => {
                if (data.length > 0) {
                    map.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 16);
                }
            });
    }

    function sendOrderWA() {
        const name = document.getElementById('passengerName').value || 'Penumpang';
        const pickup = document.getElementById('pickupLocation').value;
        const dropoff = document.getElementById('dropoffLocation').value;

        if(!pickup || !dropoff) {
            alert("Harap tentukan titik JEMPUT dan TUJUAN terlebih dahulu!");
            return;
        }

        const gmapsPickup = `https://www.google.com/maps?q=${pickup}`;
        const gmapsDropoff = `https://www.google.com/maps?q=${dropoff}`;

        const text = `Halo Admin/Driver IqBike, ada orderan baru:%0A%0A` +
            `*Nama:* ${encodeURIComponent(name)}%0A` +
            `*Titik Jemput:* ${gmapsPickup}%0A` +
            `*Titik Tujuan:* ${gmapsDropoff}`;

        // Ganti nomor ini dengan nomor WhatsApp Admin/Grup Driver
        window.open(`https://wa.me/6281234567890?text=${text}`, '_blank');
    }

    window.onload = initMap;
</script>

</body>
</html>
