<script>
    // ... (kode const, variabel, initMap, dll tetap sama hingga bagian window.onload)

    window.onload = function() {
        initMap();
        
        // --- PERBAIKAN BUG: MENGISI ULANG DATA SAAT REFRESH ---
        const activeOrder = JSON.parse(localStorage.getItem('iqbike_active_order'));
        if (activeOrder) {
            document.getElementById('passengerName').value = activeOrder.passengerName;
            document.getElementById('pickupLocation').value = activeOrder.pickup;
            document.getElementById('dropoffLocation').value = activeOrder.dropoff;
            document.getElementById('passengerPhone').value = activeOrder.passengerPhone;
            document.getElementById('passengerNote').value = activeOrder.note;
            
            pickupCoords = L.latLng(activeOrder.pickupLat, activeOrder.pickupLng);
            dropoffCoords = L.latLng(activeOrder.dropoffLat, activeOrder.dropoffLng);
            
            // Panggil fungsi untuk update UI berdasarkan status order
            setTimeout(() => {
                renderFixedMarkers();
                calculateFare();
                updatePassengerAppUI();
                updateDriverAppUI();
            }, 500);
        }
        // ----------------------------------------------------

        const savedRole = localStorage.getItem('iqbike_saved_role');
        if (savedRole === 'penumpang' || savedRole === 'driver') {
            selectUserRole(savedRole);
        } else {
            showLoginOverlay();
        }
    };
    
    // ... (sisanya fungsi lainnya tetap sama)
</script>
